{% extends "base.html" %}
{% set active = 'photos' %}
{% block content %}
<div class="page-title">📸 Наши фото</div>
<div class="grid-2" style="margin-bottom:24px">
  <div class="card">
    <div class="card-title">📤 Поделиться фото</div>
    <div class="form-group">
      <label>Выберите фото</label>
      <input type="file" id="photoFile" accept="image/*" class="input-field" style="padding:8px" onchange="previewPhoto(event)">
    </div>
    <div id="photoPreview" style="margin-bottom:12px"></div>
    <div class="form-group">
      <label>Подпись</label>
      <input type="text" id="photoCaption" class="input-field" placeholder="Наш лучший момент 💕">
    </div>
    <button class="btn-primary full-width" onclick="uploadPhoto()">Опубликовать 💕</button>
  </div>
  <div class="card" style="background:linear-gradient(135deg,#fff0f7,#ffe0ee);text-align:center">
    <div class="card-title" style="justify-content:center">💑 Наш альбом</div>
    <div id="photoCount" style="font-size:48px;font-weight:900;color:var(--pink-deep)">...</div>
    <div style="color:var(--text-light);font-size:14px;margin-bottom:20px">воспоминаний вместе</div>
    <div style="font-size:40px">📷 💕 🌸</div>
  </div>
</div>
<div class="card">
  <div class="card-title">🖼️ Все фото</div>
  <div id="photoGrid"><p style="color:var(--text-light)">Загрузка...</p></div>
</div>
 
<style>
#photoGrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
}
.photo-card {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  background: #f9f0f5;
}
.photo-card img {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  display: block;
}
.photo-card .photo-delete {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(0,0,0,0.6);
  color: white;
  border: none;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  font-size: 14px;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
.photo-info {
  padding: 6px 8px 8px;
  background: rgba(255,255,255,0.95);
}
.photo-caption {
  font-size: 12px;
  color: #444;
  margin-bottom: 2px;
}
.photo-meta {
  font-size: 11px;
  color: #999;
}
</style>
 
<script>
function previewPhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('photoPreview').innerHTML =
      `<img src="${ev.target.result}" style="width:100%;max-height:200px;object-fit:cover;border-radius:12px;border:2px solid var(--pink-soft)">`;
  };
  reader.readAsDataURL(file);
}
 
async function uploadPhoto() {
  const file = document.getElementById('photoFile').files[0];
  if (!file) { TOGETHER.toast('Выберите фото', 'error'); return; }
  const fd = new FormData();
  fd.append('photo', file);
  fd.append('caption', document.getElementById('photoCaption').value);
  const res = await TOGETHER.api('/api/photos', 'POST', fd);
  if (res.success) {
    TOGETHER.toast('Фото добавлено! 📸');
    document.getElementById('photoCaption').value = '';
    document.getElementById('photoPreview').innerHTML = '';
    document.getElementById('photoFile').value = '';
    loadPhotos();
  }
}
 
async function deletePhoto(id) {
  if (!confirm('Удалить это фото?')) return;
  const res = await fetch(`/api/photos/${id}`, { method: 'DELETE' });
  const data = await res.json();
  if (data.success) {
    TOGETHER.toast('Фото удалено');
    loadPhotos();
  }
}
 
async function loadPhotos() {
  const photos = await TOGETHER.api('/api/photos');
  const grid = document.getElementById('photoGrid');
  if (!photos || !photos.length) {
    grid.innerHTML = '<p style="text-align:center;color:var(--text-light);padding:40px">Нет фото — добавьте первое! 💕</p>';
    document.getElementById('photoCount').textContent = '0';
    return;
  }

  const valid = photos.filter(p => p.url && p.url.startsWith('data:'));
  if (!valid.length) {
    grid.innerHTML = '<p style="text-align:center;color:var(--text-light);padding:40px">Нет фото — добавьте первое! 💕</p>';
    document.getElementById('photoCount').textContent = '0';
    return;
  }
  grid.innerHTML = valid.map(p => `
    <div class="photo-card"
      onmouseover="this.querySelector('.photo-delete').style.display='flex'"
      onmouseout="this.querySelector('.photo-delete').style.display='none'">
      <img src="${p.url}" alt="${p.caption || ''}">
      <button class="photo-delete" onclick="deletePhoto(${p.id})">✕</button>
      <div class="photo-info">
        ${p.caption ? `<div class="photo-caption">${p.caption}</div>` : ''}
        <div class="photo-meta">${p.author} • ${p.date}</div>
      </div>
    </div>
  `).join('');
  document.getElementById('photoCount').textContent = valid.length;
}
 
window.addEventListener('load', () => { loadPhotos(); });
</script>
{% endblock %}
