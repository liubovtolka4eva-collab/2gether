{% extends "base.html" %}
{% set active = 'wallet' %}
{% block content %}
<div class="page-title">💰 Общий кошелёк & Копилки</div>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('wallet-tab','wt')">💸 Транзакции</button>
  <button class="tab-btn" onclick="showTab('savings-tab','wt')">🐷 Копилки</button>
</div>

<div id="wallet-tab" class="tab-content">
  <div class="grid-2">
    <div class="card">
      <div class="card-title">➕ Добавить транзакцию</div>
      <div class="form-group">
        <label>Тип</label>
        <select id="txType" class="input-field">
          <option value="expense">Расход</option>
          <option value="income">Доход</option>
        </select>
      </div>
      <div class="form-group">
        <label>Сумма (₽)</label>
        <input type="number" id="txAmount" class="input-field" placeholder="0">
      </div>
      <div class="form-group">
        <label>Категория</label>
        <select id="txCategory" class="input-field">
          <option>Продукты</option><option>Рестораны</option><option>Транспорт</option>
          <option>Развлечения</option><option>Одежда</option><option>Здоровье</option>
          <option>Дом</option><option>Красота</option><option>Спорт</option><option>Другое</option>
        </select>
      </div>
      <div class="form-group">
        <label>Описание</label>
        <input type="text" id="txDesc" class="input-field" placeholder="Например: ужин в кафе">
      </div>
      <div class="form-group">
        <label>Дата</label>
        <input type="date" id="txDate" class="input-field">
      </div>
      <button class="btn-primary full-width" onclick="addTransaction()">Добавить 💕</button>
    </div>
    <div class="card">
      <div class="card-title">📊 История транзакций</div>
      <div id="txStats" style="display:flex;gap:12px;margin-bottom:16px">
        <div style="flex:1;text-align:center;background:var(--pink-light);border-radius:12px;padding:12px">
          <div style="font-size:11px;color:var(--text-light);font-weight:700">РАСХОДЫ</div>
          <div id="totalExpense" style="font-size:22px;font-weight:900;color:#e05">—</div>
        </div>
        <div style="flex:1;text-align:center;background:#e8f5e9;border-radius:12px;padding:12px">
          <div style="font-size:11px;color:var(--text-light);font-weight:700">ДОХОДЫ</div>
          <div id="totalIncome" style="font-size:22px;font-weight:900;color:#2a9">—</div>
        </div>
      </div>
      <ul class="tx-list" id="txList">
        <li style="text-align:center;color:var(--text-light);padding:20px">Загрузка...</li>
      </ul>
    </div>
  </div>
</div>

<div id="savings-tab" class="tab-content" style="display:none">
  <div class="grid-2">
    <div class="card">
      <div class="card-title">🎯 Новая копилка</div>
      <div class="form-group">
        <label>Цель</label>
        <input type="text" id="sgTitle" class="input-field" placeholder="Например: Путешествие в Париж">
      </div>
      <div class="form-group">
        <label>Сумма цели (₽)</label>
        <input type="number" id="sgTarget" class="input-field" placeholder="100000">
      </div>
      <div class="form-group">
        <label>Эмодзи</label>
        <input type="text" id="sgEmoji" class="input-field" placeholder="🎯" maxlength="2">
      </div>
      <button class="btn-primary full-width" onclick="addSavings()">Создать копилку 💕</button>
    </div>
    <div class="card">
      <div class="card-title">💰 Наши копилки</div>
      <div id="savingsList">Загрузка...</div>
    </div>
  </div>
</div>

<div id="addFundsModal" class="modal-overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('addFundsModal')">×</button>
    <div class="modal-title">💰 Пополнить копилку</div>
    <input type="hidden" id="fundGoalId">
    <div class="form-group">
      <label>Сумма (₽)</label>
      <input type="number" id="fundAmount" class="input-field" placeholder="0">
    </div>
    <button class="btn-primary full-width" onclick="addFunds()">Пополнить 🐷</button>
  </div>
</div>

<script>
const CATS = {'Продукты':'🛒','Рестораны':'🍽️','Транспорт':'🚗','Развлечения':'🎬','Одежда':'👗','Здоровье':'💊','Дом':'🏠','Красота':'💄','Спорт':'🏋️','Другое':'📦'};

function showTab(id, group) {
  document.querySelectorAll('.tab-content').forEach(el=>el.style.display='none');
  document.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById(id).style.display='';
  event.target.classList.add('active');
}

document.getElementById('txDate').value = new Date().toISOString().split('T')[0];

async function loadTransactions() {
  const txs = await TOGETHER.api('/api/transactions');
  const list = document.getElementById('txList');
  let expTotal=0, incTotal=0;
  list.innerHTML = txs.map(t => {
    if(t.type==='expense') expTotal+=t.amount; else incTotal+=t.amount;
    const icon = CATS[t.category]||'📦';
    return `<li class="tx-item">
      <span class="tx-icon">${icon}</span>
      <div class="tx-info">
        <div class="tx-title">${t.description||t.category}</div>
        <div class="tx-date">${t.category} • ${t.date}</div>
      </div>
      <span class="tx-amount ${t.type}">${t.type==='expense'?'−':'+'} ${TOGETHER.formatMoney(t.amount)}</span>
    </li>`;
  }).join('') || '<li style="text-align:center;color:var(--text-light);padding:20px">Нет транзакций</li>';
  document.getElementById('totalExpense').textContent = TOGETHER.formatMoney(expTotal);
  document.getElementById('totalIncome').textContent = TOGETHER.formatMoney(incTotal);
}

async function addTransaction() {
  const data = {
    type: document.getElementById('txType').value,
    amount: document.getElementById('txAmount').value,
    category: document.getElementById('txCategory').value,
    description: document.getElementById('txDesc').value,
    date: document.getElementById('txDate').value
  };
  if(!data.amount) { TOGETHER.toast('Введите сумму','error'); return; }
  await TOGETHER.api('/api/transactions','POST',data);
  TOGETHER.toast('Транзакция добавлена 💕');
  loadTransactions();
}

async function loadSavings() {
  const goals = await TOGETHER.api('/api/savings');
  const div = document.getElementById('savingsList');
  if(!goals.length) { div.innerHTML='<p style="text-align:center;color:var(--text-light)">Нет копилок</p>'; return; }
  div.innerHTML = goals.map(g => `
    <div style="margin-bottom:20px;background:var(--pink-light);border-radius:14px;padding:16px;border:1.5px solid var(--pink-soft)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <span style="font-size:28px">${g.emoji}</span>
        <div>
          <div style="font-weight:800;font-size:16px">${g.title}</div>
          <div style="font-size:13px;color:var(--text-light)">${TOGETHER.formatMoney(g.current)} / ${TOGETHER.formatMoney(g.target)}</div>
        </div>
        <button class="btn-secondary" style="margin-left:auto;font-size:12px;padding:5px 12px" onclick="openFundModal(${g.id})">+ Пополнить</button>
      </div>
      <div class="stat-bar"><div class="stat-bar-fill" style="width:${g.percent}%"></div></div>
      <div style="text-align:right;font-size:12px;color:var(--pink-main);font-weight:700;margin-top:4px">${g.percent}%</div>
    </div>
  `).join('');
}

async function addSavings() {
  const data = {
    title: document.getElementById('sgTitle').value,
    target: document.getElementById('sgTarget').value,
    emoji: document.getElementById('sgEmoji').value||'🎯'
  };
  if(!data.title||!data.target) { TOGETHER.toast('Заполните все поля','error'); return; }
  await TOGETHER.api('/api/savings','POST',data);
  TOGETHER.toast('Копилка создана! 🐷');
  loadSavings();
}

function openFundModal(id) {
  document.getElementById('fundGoalId').value = id;
  document.getElementById('fundAmount').value = '';
  TOGETHER.openModal('addFundsModal');
}

async function addFunds() {
  const id = document.getElementById('fundGoalId').value;
  const amount = document.getElementById('fundAmount').value;
  await TOGETHER.api('/api/savings','POST',{action:'add_funds',id,amount});
  TOGETHER.closeModal('addFundsModal');
  TOGETHER.toast('Пополнено! 💰');
  loadSavings();
}

window.addEventListener('load', () => {
  loadTransactions();
  loadSavings();
});
</script>
{% endblock %}
